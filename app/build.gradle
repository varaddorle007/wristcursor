apply plugin: 'com.android.application'

android {
    namespace 'com.wristcursor.app'
    compileSdk 34

    // Legacy package tree left in src — do not compile it (breaks HID singleton / connect).
    sourceSets {
        main {
            java {
                exclude 'com/ginkage/**'
            }
        }
    }

    defaultConfig {
        applicationId "com.wristcursor.app"
        minSdkVersion 34
        targetSdkVersion 34
        versionCode 78
        versionName "1.65-reconnect"
        externalNativeBuild {
            cmake {
                // Modern NDK: gnustl is gone; use libc++. NEON only on ARM.
                arguments "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang"
                cppFlags.addAll([
                    "-std=c++11",
                    "-Os",
                    "-ffunction-sections",
                    "-fdata-sections",
                    "-fvisibility=hidden",
                ])
            }
        }
        ndk {
            // Galaxy Watch 6 is arm64; skip x86 emulator ABIs that were failing CMake
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
    // One APK for the watch — simpler installs from Android Studio
    splits {
        abi {
            enable false
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }
    ndkVersion "26.1.10909125"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.6'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
